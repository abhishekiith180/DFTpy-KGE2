[JOB]
task = Optdensity
;task = Calculation
;calctype = Both Force Stress

[PATH]
pppath = ../../../DATA/
cellpath = .

[MATH]
linearie = T
linearii = T
;twostep = T

[PP]
In = in.lda.recpot     
As = as.lda.recpot

[CELL]
cellfile = InAs.vasp
elename = In As
zval = 3.0 5.0
format = vasp

[GRID]
;ecut = 1200
nr = 30 30 30

[DENSITY]
densityoutput = den.InAs.KGE2.lda.xsf

[EXC]
xc = LDA

[KEDF]
kedf = KGE2
params = 1.48 1.0

[OPT]
;method = TN
;method = CG-HS
;method = LBFGS
;algorithm = EMM
algorithm = OESCF
;vector = Scaling
;c1 = 1e-4
;c2 = 2e-1
;maxls = 10
maxiter = 200
maxfun = 50
econv = 1e-6
;h0 = 1.0
;h0 = 0.025
