[OPT]
;method = TN
;method = CG-HS
;method = LBFGS
;algorithm = EMM
;algorithm = OESCF
;vector = Scaling
;c1 = 1e-4
;c2 = 2e-1
;maxls = 10
maxiter = 200
maxfun = 50
econv = 1e-6
;h0 = 1.0
;h0 = 0.025
